version: '3.3'
services:
  partdb:
    container_name: partdb
    # Changed host port to 8081 to avoid conflict
    ports:
      - '8081:80'
    volumes:
      # By default
      - ./uploads:/var/www/html/uploads
      - ./public_media:/var/www/html/public/media
      - ./db:/var/www/html/var/db
    restart: unless-stopped
    image: jbtronics/part-db1:latest
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      # Watchtower API Connection (allows Part-DB Web UI to trigger updates)
      - WATCHTOWER_API_URL=http://watchtower:8080
      - WATCHTOWER_API_TOKEN=8c3b7a59d1e2f406981a7b3c2d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e

      # Put SQLite database in our mapped folder. You can configure some other kind of database here too.
      - DATABASE_URL=sqlite:///%kernel.project_dir%/var/db/app.db
      # In docker env logs will be redirected to stderr
      - APP_ENV=docker
      # Secret key used to sign cookies and CSRF tokens. MUST be changed to a unique random value before going live!
      # Generate one with: openssl rand -hex 32
      - APP_SECRET=3329da076518572f0bc18cbe2eb2367216c16f19fc549b9e7880e0110c715619

      # You can configure Part-DB using environment variables
      # Below you can find the most essential ones predefined
      # However you can add any other environment configuration you want here
      # See .env file for all available options or https://docs.part-db.de/configuration.html
      # !!! Do not use quotes around the values, as they will be interpreted as part of the value and this will lead to errors !!!

      # The language to use serverwide as default (en, de, ru, etc.)
      - DEFAULT_LANG=en
      # The default timezone to use serverwide (e.g. Europe/Berlin)
      - DEFAULT_TIMEZONE=Europe/London
      # The currency that is used inside the DB (and is assumed when no currency is set). This can not be changed later, so be sure to set it the currency used in your country
      - BASE_CURRENCY=GBP
      # The name of this installation. This will be shown as title in the browser and in the header of the website
      - INSTANCE_NAME=KC-PARTS

      # Allow users to download attachments to the server by providing an URL
      # This could be a potential security issue, as the user can retrieve any file the server has access to (via internet)
      - ALLOW_ATTACHMENT_DOWNLOADS=0
      # Use gravatars for user avatars, when user has no own avatar defined
      - USE_GRAVATAR=0

      # Override value if you want to show a given text on homepage.
      # When this is empty the content of config/banner.md is used as banner
      #- BANNER=This is a test banner<br>with a line break
    
      # If you use a reverse proxy in front of Part-DB, you must configure the trusted proxies IP addresses here (see reverse proxy documentation for more information):
      - TRUSTED_PROXIES=0.0.0.0/0,::/0

      # Default URI for PartDB (used for generating absolute links)
      - DEFAULT_URI=https://partdb.kierancollins.xyz/
      - TRUSTED_HOSTS=.*

  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_TOKEN=8c3b7a59d1e2f406981a7b3c2d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true

